<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
    }
    h1 { color: #174ea6; }
    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 12px 22px;
      background: #174ea6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
    #answer {
      background: white;
      padding: 15px;
      margin-top: 20px;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>Study AI</h1>
  <p>Your personal AI study assistant.</p>

  <textarea id="question" placeholder="Ask your study question..."></textarea>
  <button id="askButton" onclick="askAI()">Ask AI</button>
  <div id="answer"></div>

  <script>
    async function askAI() {
      const question = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer");
      const button = document.getElementById("askButton");

      if (!question) {
        answer.textContent = "Please enter a question.";
        return;
      }

      button.disabled = true;
      answer.textContent = "Study AI is thinking...";

      try {
        const response = await fetch(
          "https://empty-salad-74d7.abichoga3.workers.dev",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
          }
        );

        const data = await response.json();
        answer.textContent = data.answer || data.error || "No answer received.";
      } catch (error) {
        answer.textContent = "Connection failed. Please try again.";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
