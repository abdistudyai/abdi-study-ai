
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Study AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #202124;
      min-height: 100vh;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #eeeeee;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #e8f0fe;
      color: #174ea6;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: bold;
    }

    header h2 {
      margin: 0;
      font-size: 21px;
      color: #174ea6;
    }

    header p {
      margin: 4px 0 0;
      color: #777777;
      font-size: 12px;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 45px 20px 30px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 32px;
    }

    .welcome-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .welcome h1 {
      font-size: 30px;
      margin: 0 0 12px;
      letter-spacing: -0.8px;
    }

    .welcome h1 span {
      color: #2563eb;
    }

    .welcome p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.7;
      margin: 0 auto;
      max-width: 450px;
    }

    .chat-box {
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 14px;
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }

    textarea {
      width: 100%;
      min-height: 125px;
      border: none;
      outline: none;
      resize: vertical;
      font-family: inherit;
      font-size: 16px;
      color: #202124;
      padding: 8px;
      background: transparent;
    }

    textarea::placeholder {
      color: #9ca3af;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid #f0f0f0;
      padding-top: 12px;
    }

    .hint {
      font-size: 12px;
      color: #888888;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #answer {
      display: none;
      margin-top: 22px;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      line-height: 1.8;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer-title {
      color: #174ea6;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .examples {
      margin-top: 26px;
    }

    .examples h3 {
      font-size: 14px;
      color: #555555;
      margin-bottom: 12px;
    }

    .example-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .example-buttons button {
      background: #ffffff;
      color: #444444;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 10px 13px;
      font-weight: normal;
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: #999999;
      font-size: 12px;
      padding: 25px 15px;
    }

    @media (max-width: 480px) {
      main {
        padding: 35px 15px 25px;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .hint {
        font-size: 11px;
      }

      button {
        padding: 12px 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">S</div>
    <div>
      <h2>Study AI</h2>
      <p>Your personal study assistant</p>
    </div>
  </header>

  <main>
    <section class="welcome">
      <div class="welcome-icon">📚</div>
      <h1>Learn smarter with <span>AI.</span></h1>
      <p>
        Ask questions, understand difficult topics,
        create notes and improve your learning.
      </p>
    </section>

    <section class="chat-box">
      <textarea
        id="question"
        placeholder="Ask anything about your studies..."
        aria-label="Your study question"
      ></textarea>

      <div class="controls">
        <span class="hint">Study smarter, every day.</span>
        <button id="askButton" onclick="askAI()">Ask AI ↗</button>
      </div>
    </section>

    <section id="answer" aria-live="polite">
      <div class="answer-title">Study AI's answer</div>
      <div id="answerText"></div>
    </section>

    <section class="examples">
      <h3>Try asking</h3>
      <div class="example-buttons">
        <button onclick="useExample('What is marketing?')">
          What is marketing?
        </button>
        <button onclick="useExample('Explain public relations.')">
          Public relations
        </button>
        <button onclick="useExample('Explain communication skills.')">
          Communication skills
        </button>
      </div>
    </section>
  </main>

  <footer>
    Study AI · Your learning companion
  </footer>

  <script>
    async function askAI() {
      const question = document.getElementById("question").value.trim();
      const answerBox = document.getElementById("answer");
      const answerText = document.getElementById("answerText");
      const button = document.getElementById("askButton");

      if (!question) {
        answerBox.style.display = "block";
        answerText.textContent = "Please enter a question first.";
        return;
      }

      button.disabled = true;
      button.textContent = "Thinking...";
      answerBox.style.display = "block";
      answerText.textContent = "Study AI is preparing your answer...";

      try {
        const response = await fetch(
          "https://empty-salad-74d7.abichoga3.workers.dev",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ question })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI request failed.");
        }

        answerText.textContent =
          data.answer || data.error || "No answer received.";

      } catch (error) {
        answerText.textContent =
          error.message || "Connection failed. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Ask AI ↗";
      }
    }

    function useExample(question) {
      document.getElementById("question").value = question;
      document.getElementById("question").focus();
    }

    document.getElementById("question").addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          askAI();
        }
      }
    );
  </script>
</body>
</html>
